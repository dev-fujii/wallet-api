spring.application.name=wallet-api

# 手元では .env を読み、本番では同じ名前の環境変数を渡す
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

# テーブルは Flyway が作り、Hibernate は形が合うかの確認だけにする
spring.jpa.hibernate.ddl-auto=validate
# DB の読み込みをサービス層の中で終わらせる
spring.jpa.open-in-view=false
